[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-control-plane"
version = "0.1.0.dev0"
description = "Capability discovery, per-turn closure, and cross-turn memory for Agent Skill libraries."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "XianbaoLi"}]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
skill-control-plane = "skill_control_plane.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dense = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
