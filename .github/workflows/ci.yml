name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q src scripts

  pi-adapter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: adapters/pi/package-lock.json
      - name: Install adapter dependencies
        run: npm --prefix adapters/pi ci
      - name: Adapter tests
        run: npm --prefix adapters/pi test
      - name: Adapter typecheck
        run: npm --prefix adapters/pi run typecheck
